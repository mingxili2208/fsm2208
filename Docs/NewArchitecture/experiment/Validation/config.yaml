# 简化的config.yaml - 移除硬编码路径
project:
  name: "FSM Sandbox Validation"
  version: "3.1"
  description: "Intelligent Adaptive Timing and Baseline Analysis"

# 全局话题配置
topics:
  ground_truth: "/real_world/follow_adtruck/transformed_with_covariance"
  virtual_lidar: "/sensing/lidar/concatenated/pointcloud"
  ndt_output: "/localization/pose_estimator/pose"
  carla_sync: "/fsm_sandbox/timing/t1_t2"
  planning_output: "/planning/scenario_planning/trajectory"

# 实验A1：时效性验证
experiment_a1:
  topics:
    timing_sync: "/fsm_sandbox/timing/t1_t2"
    lidar_input: "/sensing/lidar/concatenated/pointcloud"
    ndt_output: "/localization/pose_estimator/pose"
  parameters:
    correlation_window_ns: 50000000
    cleanup_threshold_ns: 60000000000
    stats_report_interval_s: 5.0

# 实验A2：保真度验证
experiment_a2:
  topics:
    ground_truth: "/real_world/follow_adtruck/transformed_with_covariance"
    virtual_lidar: "/sensing/lidar/concatenated/pointcloud"
    offline_ndt: "/localization/kinematic_state"
  parameters:
    alignment_tolerance_windows_ms: [10, 50, 100, 200]
    min_alignment_rate_percent: 50
    outlier_removal_enabled: true
    outlier_iqr_factor: 1.5

# 实验B：智能基线分析
experiment_b:
  # 复用A1结果作为R2V延迟
  r2v_data_source: "experiment_a1"
  
  # 智能基线检测参数
  intelligent_detection:
    min_straight_distance_m: 20.0        # 最小直线距离
    max_direction_variance_deg: 5.0      # 最大方向变化
    min_straight_duration_s: 10.0        # 最小直线持续时间
    target_velocity_ms: 0.5              # 期望的基线速度
    velocity_tolerance: 0.2              # 速度容差（±0.2 m/s）
    
  # V2R延迟分析配置
  v2r_analysis:
    pc_controller_log_dir: "../_Sys/log"
    timing_log_pattern: "timing_log_*.csv"
    
  # 质量控制阈值
  quality_thresholds:
    max_acceptable_r2v_latency_ms: 100
    max_acceptable_v2r_latency_ms: 50
    error_prediction_accuracy_threshold: 0.8

# 文件管理
file_management:
  base_directories:
    data: "data"
    logs: "logs" 
    results: "results"
  file_naming:
    timestamp_format: "%Y%m%d_%H%M%S"
    use_session_id: true